# Đưa website lên GitHub Pages mỗi khi nhánh main thay đổi (hoặc bấm chạy tay trong tab Actions).
# Cần bật: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Chỉ tải các model web thật sự dùng (tiết kiệm hạn mức băng thông Git LFS)
      - name: Tải model (Git LFS)
        run: git lfs pull --include="models/Home.glb,models/11958.glb,models/meaning.glb,models/TT.glb,models/optimized/*"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
